version: '3.8'

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: mes_user
      POSTGRES_PASSWORD: mes_password
      POSTGRES_DB: hotrunner_mes
    ports:
      # 显式绑定到 0.0.0.0 确保宿主机所有网卡（含局域网网卡）都监听
      - "0.0.0.0:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  backend:
    build:
      context: ./server-python
      dockerfile: Dockerfile
    volumes:
      - ./server-python:/app
    ports:
      # 0.0.0.0 绑定：局域网设备可通过 <宿主机IP>:8080 访问
      - "0.0.0.0:8080:8000"
    environment:
      - DATABASE_URL=postgresql://mes_user:mes_password@db:5432/hotrunner_mes
      # - VITE_API_BASE_URL=http://192.168.1.10:8080
      - VITE_API_BASE_URL=http://192.168.5.33:8080
    # 强制 uvicorn 监听 0.0.0.0，否则默认只绑 127.0.0.1 导致容器外无法访问
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    depends_on:
      - db
    restart: unless-stopped

  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    volumes:
      - ./client:/app
      - /app/node_modules
    ports:
      # 0.0.0.0 绑定：局域网设备可通过 <宿主机IP>:9956 访问
      - "0.0.0.0:9956:5173"
    environment:
      # - VITE_API_BASE_URL=http://192.168.1.10:8080
      - VITE_API_BASE_URL=http://192.168.5.33:8080
    # --host 0.0.0.0 让 Vite dev server 监听所有网卡，而不是默认的 localhost
    command: npx vite --host 0.0.0.0 --port 5173
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
